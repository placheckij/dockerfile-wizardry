version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows/ current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image tags and digests in the Dockerfiles. Dependabot skips a FROM built
  # from ARGs, so the Dockerfiles write the reference out (DW-BASE-01). The weekly
  # "Base Image Digest Is Current" CI job is a second check on the main Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (pyproject.toml / uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
