version: 2
updates:
  # Keeps the SHA-pinned actions in ci.yml current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image tags in the Dockerfiles. The main Dockerfile's FROM is assembled
  # from ARGs, which Dependabot may not be able to follow - the weekly
  # "Base Image Digest Is Current" CI job is what guarantees a stale pin is noticed.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (pyproject.toml / poetry.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
