name: 🔐 Secret Scan

# A secret can be committed in any file, so unlike the other workflows this one has no path
# filter and runs on every push and pull request (CIS 4.9). It has no schedule: the action pins
# the Trivy version, and with it the secret rules, so an unchanged repository scans the same.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: 🔐 Scan the Repository for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan the repository for secrets (CIS 4.9)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'
