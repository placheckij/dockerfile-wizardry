name: 🧙‍♂️ Dockerfile Wizardry CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Weekly rebuild without cache: picks up OS patches and re-scans against new
  # CVEs even when nobody pushed (CIS 4.4). A red run emails the last editor of
  # this cron line.
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  DOCKER_BUILDKIT: 1
  IMAGE_NAME: dockerfile-wizardry

jobs:
  lint-dockerfile:
    name: 🔍 Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      # The smoke-test scripts are bash; shellcheck is preinstalled on GitHub's runners
      - name: Lint shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh

      # The Python scripts in .github/scripts run with the runner's system python3, not the
      # project's Python 3.14. `ruff format` targets 3.14 and can emit syntax older Pythons
      # reject (e.g. `except A, B:`), so compile them with the interpreter that will run them.
      - name: Check the workflow scripts compile with the runner's Python
        run: |
          python3 --version
          python3 -m py_compile .github/scripts/*.py

      # The README's table of contents is generated; fail if a heading changed and it was not
      # regenerated (fix: python3 .github/scripts/readme_toc.py)
      - name: Check the README table of contents is up to date
        run: python3 .github/scripts/readme_toc.py --check

  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          # The single-stage files are deliberately naive benchmark baselines (they run as root)
          skip-files: 'Dockerfile.single-stage-alpine,Dockerfile.single-stage-slim'

      - name: Scan the repository for secrets (CIS 4.9)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'secret'
          format: 'table'
          exit-code: '1'

  build-and-test:
    name: 🏗️ Build & Test Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:latest
          # The weekly run must not reuse cached layers, or `apk upgrade` would never refresh
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test image - Check user is non-root
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest id | grep -q "uid=1337(wizard)"
          echo "✅ Container runs as non-root user (wizard)"

      - name: Test image - Verify file permissions
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:latest ls -la /spellbook/ | head -10
          echo "✅ File permissions verified"

      # The app user must not own or be able to modify its code and dependencies,
      # even on a writable filesystem (Spell #9): an owner can chmod its own files
      # back to writable, and a writable /spellbook allows entries to be replaced.
      - name: Test image - App user cannot modify its code or dependencies
        run: |
          docker run --rm --entrypoint sh ${{ env.IMAGE_NAME }}:latest -c '
            fail=0
            for p in /spellbook /spellbook/.venv /spellbook/main.py /spellbook/spells; do
              if [ -w "$p" ]; then echo "writable: $p"; fail=1; fi
            done
            if chmod u+w /spellbook/main.py 2>/dev/null; then echo "chmod u+w main.py succeeded"; fail=1; fi
            exit $fail'
          echo "✅ Application files are read-only for the app user"

      # setuid/setgid binaries are a privilege-escalation route (CIS 4.7, Level 2).
      # The image has none today; this keeps it that way. Runs as root so find can read
      # every directory (as the unprivileged user it exits 1 and would skip unreadable
      # ones); the trailing `true` keeps bash -e from aborting on find's exit code.
      - name: Test image - No setuid or setgid files
        run: |
          found=$(docker run --rm --user root --entrypoint sh ${{ env.IMAGE_NAME }}:latest -c 'find / -xdev -perm /6000 -type f 2>/dev/null; true')
          if [ -n "$found" ]; then
            echo "setuid/setgid files found:"
            echo "$found"
            exit 1
          fi
          echo "✅ No setuid or setgid files"

      - name: Test image - Health check
        run: |
          docker run -d --name test-container -p 8000:8000 ${{ env.IMAGE_NAME }}:latest
          trap 'docker logs test-container; docker rm -f test-container' EXIT
          curl -f --retry 10 --retry-delay 1 --retry-all-errors http://localhost:8000/health
          echo "✅ Health check passed"

      # Guard against a blind scanner: if the apk database is removed from the image,
      # Trivy sees zero OS packages and the vulnerability scan below passes vacuously.
      - name: List packages Trivy can see
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'json'
          output: 'trivy-packages.json'
          list-all-pkgs: true
          exit-code: '0'

      - name: Assert Trivy sees OS and Python packages
        run: |
          os=$(jq '[.Results[]? | select(.Class=="os-pkgs") | (.Packages // []) | length] | add // 0' trivy-packages.json)
          py=$(jq '[.Results[]? | select(.Class=="lang-pkgs") | (.Packages // []) | length] | add // 0' trivy-packages.json)
          echo "Trivy sees $os OS packages and $py Python packages"
          test "$os" -gt 0 && test "$py" -gt 0

      - name: Scan image for vulnerabilities with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  python-tests:
    name: 🧪 Run Python Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      # Same uv version as the Dockerfiles. setup-uv caches uv's download cache,
      # keyed on uv.lock, so no separate cache step is needed.
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.6
          enable-cache: true
          cache-dependency-glob: uv.lock

      # --locked: fail if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked

      - name: Lint and check formatting
        run: |
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      - name: Run tests
        run: |
          uv run --locked pytest spellbook/tests/ -v --cov=spellbook --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.python-version == '3.14'
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # The base image is pinned by digest, which freezes it. This weekly check fails
  # (and prints the new digest) when the tag has been republished, e.g. with
  # security patches. Not run on pushes/PRs: upstream moving must not block them.
  base-image-freshness:
    name: 📌 Base Image Digest Is Current
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the pinned digest with the tag
        run: python3 -I .github/scripts/check_base_image.py

  summary:
    name: 📊 CI Summary
    runs-on: ubuntu-latest
    needs: [lint-dockerfile, security-scan, build-and-test, python-tests, base-image-freshness]
    if: always()
    steps:
      - name: Check job status
        run: |
          echo "## 🧙‍♂️ Dockerfile Wizardry CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile Lint | ${{ needs.lint-dockerfile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Scan | ${{ needs.security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Tests | ${{ needs.python-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Base Image Digest | ${{ needs.base-image-freshness.result }} |" >> $GITHUB_STEP_SUMMARY
