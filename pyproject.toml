[tool.poetry]
name = "dockerfile-wizardry"
version = "1.0.0"
description = "Demonstrating Docker best practices with magical flair"
authors = ["Jakub Płachecki <jakub@plachecki.dev>"]
readme = "README.md"
packages = [{include = "spellbook"}]

[tool.poetry.dependencies]
python = "^3.14"
fastapi = "^0.162.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-cov = "^7.1.0"
ruff = "^0.17.3"
isort = "^9.0.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["spellbook/tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py314"
